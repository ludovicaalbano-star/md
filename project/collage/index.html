<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galleria Sovrapposta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-image">
        <!-- Gruppo centrale -->
        <div class="group-center">
            <img src="images/2.png" class="img-main" alt="Immagine 2">
            <img src="images/3.png" class="img-overlay img3" alt="Immagine 3">
            <img src="images/4.png" class="img-overlay img4" alt="Immagine 4">
        </div>

        <!-- Gruppo inferiore -->
        <div class="group-bottom">
            <img src="images/8.png" class="img-main" alt="Immagine 8">
            <img src="images/5.png" class="img-overlay img5" alt="Immagine 5">
            <img src="images/6.png" class="img-overlay img6" alt="Immagine 6">
            <img src="images/7.png" class="img-overlay img7" alt="Immagine 7">
        </div>
    </div>
</body>
</html>
